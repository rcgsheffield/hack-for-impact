[project]
name = "hack-for-impact"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shaun Donnelly", email = "shaun.t.e.donnelly@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "gradio>=6.32.0",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-ollama>=1.1.0",
    "mcp>=2.3.0",
    "openai>=3.50.0",
    "playwright>=1.65.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
hack-for-impact = "hack_for_impact:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
