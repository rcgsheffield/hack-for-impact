      // the whole path appears dim, then each stage lights up as the narration reaches it

      tl.set(["#dw-branch", "#dw-p1", ".dw-owner", "#dw-stop", "#dw-packet", "#dw-packet-b", "#dw-packet-r"], { opacity: 0 }, 0);
      const light = (i, at) => {
        tl.fromTo(NODES[i], { opacity: 0.4, borderColor: "#3a4a30" }, { opacity: 1, borderColor: "#76b900", duration: 0.35, ease: "power2.out" }, at);
        tl.fromTo(NODES[i], { scale: 1 }, { scale: 1.06, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, at);

      const arrow = (sel, at) => {
        tl.fromTo(sel, { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "power2.inOut" }, at);
      };
      const move = (i, at, dur) => {
        tl.fromTo("#dw-packet", { x: X[i - 1] }, { x: X[i], duration: dur, ease: "power2.inOut", immediateRender: false }, at);

      // 01 describe

      arrow("#dw-a1", CUE.owns - 0.5);
      move(1, CUE.owns - 0.5, 0.5);
      light(1, CUE.owns);

      // branch: another owner -> tell the resident, stop
      tl.fromTo("#dw-d1", { opacity: 1, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.35, ease: "power2.out" }, CUE.branches);

      tl.fromTo("#dw-packet-b", { y: 0 }, { y: 100, duration: 0.6, ease: "power2.in", immediateRender: false }, CUE.branches + 0.4);
      tl.fromTo("#dw-packet-b", { opacity: 1 }, { opacity: 0, duration: 0.25, immediateRender: false }, CUE.branches + 1.0);
      tl.fromTo("#dw-stop", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, CUE.stop);
      tl.fromTo("#dw-branch", { opacity: 1 }, { opacity: 0.55, duration: 0.5, immediateRender: false }, CUE.council - 0.2);

      // 03 the council's: duplicate check
      arrow("#dw-a2", CUE.council);
      move(2, CUE.council, 0.9);
      light(2, CUE.dup);
      // 04 file

      move(3, CUE.file - 0.5, 0.5);
      light(3, CUE.file);
      // 05 triage

      move(4, CUE.triage - 0.4, 0.4);
      light(4, CUE.triage);

      // P1 branch: phone now
      tl.fromTo("#dw-d2", { opacity: 1, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.35, ease: "power2.out" }, CUE.phone);
      tl.fromTo("#dw-p1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, CUE.phone + 0.2);
      tl.fromTo("#dw-packet-r", { opacity: 0, y: 0 }, { opacity: 1, y: 0, duration: 0.2 }, CUE.phone);
      tl.fromTo("#dw-packet-r", { y: 0 }, { y: 100, duration: 0.6, ease: "power2.in", immediateRender: false }, CUE.phone + 0.2);
      tl.fromTo("#dw-packet-r", { opacity: 1 }, { opacity: 0, duration: 0.25, immediateRender: false }, CUE.phone + 0.8);
