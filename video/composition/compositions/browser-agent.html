      const CUE = {

        vo07: 0.50, // 07 narrator: "And where the council only has a web form,"
        webForm: 2.77, // 07 "…a web form": browser window appears
        fills: 4.06, // 07 "the agent fills it in": agent says it's opening the form
        opens: 6.98, // 07 "It opens the form in a browser": page loads
        reads: 8.92, // 07 "reads the page": read_page, scan line
        clicks: 10.22, // 07 "then clicks": Road radio
        types: 10.54, // 07 "types": location typed
        picks: 11.19, // 07 "and picks from the dropdowns": depth selected
        error: 12.10, // Continue pressed, the form complains
        fixes: 12.81, // 07 "and fixes its own mistakes": further information typed
        review: 14.70, // 07 "…when the form complains": Continue, review page
        noApi: 15.40, // 07 "No integration project.": agent asks to confirm
        works: 16.70, // 07 "It works with the forms councils already have.": caption
      };
      const tl = gsap.timeline({ paused: true });
      const IN = { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" };
      const pop = (sel, at) =>
        tl.fromTo(sel, { opacity: 0, y: 16, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, at);
      const flash = (sel, at) =>
        tl.fromTo(sel, { backgroundColor: "rgba(118,185,0,0)" }, { backgroundColor: "rgba(118,185,0,0.22)", duration: 0.25, yoyo: true, repeat: 1, ease: "power2.out" }, at);


      tl.fromTo("#ba-kicker", { opacity: 0 }, { opacity: 1, duration: 0.4 }, CUE.enter);
      tl.fromTo("#ba-title", { opacity: 0, y: 20 }, IN, CUE.enter + 0.1);
      tl.fromTo("#ba-chat", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, CUE.enter + 0.2);
      pop("#ba-me", CUE.vo07 + 0.4);

      // browser window arrives on "web form"
      tl.fromTo("#ba-win", { opacity: 0, y: 40, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "expo.out", immediateRender: false }, CUE.webForm);
      pop("#ba-b1", CUE.fills);

      // page loads
      tl.fromTo("#ba-url-t", { opacity: 0.2 }, { opacity: 1, duration: 0.4 }, CUE.opens);
      tl.fromTo("#ba-load", { opacity: 1 }, { opacity: 0, duration: 0.25 }, CUE.opens + 0.1);
      tl.fromTo("#ba-page", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, CUE.opens + 0.3);

      // read_page: a scan line sweeps the page
      pop("#ba-k1", CUE.reads);
      tl.fromTo("#ba-scan", { opacity: 0 }, { opacity: 1, duration: 0.15, immediateRender: false }, CUE.reads);
      tl.fromTo("#ba-scan", { y: 0 }, { y: 520, duration: 1.0, ease: "power1.inOut" }, CUE.reads);
      tl.fromTo("#ba-scan", { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, CUE.reads + 0.95);

      // click, type, select
      pop("#ba-k2", CUE.clicks);
      flash("#ba-r1", CUE.clicks);
      tl.fromTo("#ba-road", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, CUE.clicks + 0.1);
      pop("#ba-k3", CUE.types);
      tl.fromTo("#ba-loc", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.6, ease: "steps(21)", immediateRender: false }, CUE.types + 0.1);
      pop("#ba-k4", CUE.picks);
      flash("#ba-r3", CUE.picks);
      tl.fromTo("#ba-depth", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, CUE.picks + 0.2);

      // Continue with a blank field: the form complains
      tl.fromTo("#ba-btn", { scale: 1 }, { scale: 0.92, duration: 0.1, yoyo: true, repeat: 1 }, CUE.error);
      tl.fromTo("#ba-err", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.25, immediateRender: false }, CUE.error + 0.2);
      tl.fromTo("#ba-info", { borderColor: "#8a94a3" }, { borderColor: "#c62828", duration: 0.2 }, CUE.error + 0.2);
      tl.fromTo("#ba-err", { y: 0 }, { y: -3, duration: 0.06, yoyo: true, repeat: 3 }, CUE.error + 0.3);

      // the agent fixes it
      pop("#ba-k5", CUE.fixes);
      tl.fromTo("#ba-info-t", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "steps(35)", immediateRender: false }, CUE.fixes + 0.2);
      tl.fromTo("#ba-info", { borderColor: "#c62828" }, { borderColor: "#2e7d32", duration: 0.25, immediateRender: false }, CUE.fixes + 1.1);
      tl.fromTo("#ba-err", { opacity: 1 }, { opacity: 0, duration: 0.25, immediateRender: false }, CUE.fixes + 1.1);

      // Continue: review page
      tl.fromTo("#ba-btn", { scale: 1 }, { scale: 0.92, duration: 0.1, yoyo: true, repeat: 1, immediateRender: false }, CUE.review - 0.3);
      tl.fromTo("#ba-page", { opacity: 1 }, { opacity: 0, duration: 0.25, immediateRender: false }, CUE.review);
      tl.fromTo("#ba-review", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, CUE.review + 0.15);

      // asks before submitting
      pop("#ba-b2", CUE.noApi);
      tl.fromTo("#ba-wait", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)", immediateRender: false }, CUE.noApi + 0.3);

      // caption
      tl.fromTo("#ba-caption", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, CUE.works);
      tl.fromTo("#ba-foot", { opacity: 0 }, { opacity: 1, duration: 0.5, immediateRender: false }, CUE.works + 0.6);
      window.__timelines["browser-agent"] = tl;
    })();
