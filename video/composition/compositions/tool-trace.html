    (function () {
      // Scene 10, clip 10. Times in seconds from scene start (global 195 s).
      // Estimates at ~2.6 spoken words/s with the clip starting at 0.5 s; retime by editing these numbers.
      const CUE = {
        intro: 0.50, // "The model decides what to do next and calls three tools."
        route: 4.51, // "Route report"
        council: 6.94, // "council,"
        highways: 7.41, // "National Highways,"
        police: 8.15, // "police,"
        dvla: 8.62, // "DVLA"
        landowner: 9.18, // "or a private landowner."
        assess: 10.11, // "Assess pothole"
        depth: 11.24, // "checks the depth"
        thresholds: 12.73, // "against the council's thresholds."
        file: 13.66, // "File report"
        fields: 15.34, // "fills in the exact fields of the council's pothole form"
        reference: 18.52, // "and issues a reference."
        error: 19.64, // "If a tool call goes wrong,"
        loop: 20.57, // ("goes wrong") file_report bubble collapses, error loop draws
        backToModel: 21.69, // "the error goes back to the model"
        correct: 24.30, // "so it can correct itself."
        logged: 26.36, // "Every step is logged,"
        why: 28.41, // "so staff can see why a report was routed the way it was."
      };
      const tl = gsap.timeline({ paused: true });
      const show = (sel, at, from) =>
        tl.fromTo(sel, Object.assign({ opacity: 0 }, from || { y: 16 }), { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power4.out" }, at);
      const hide = (sel, at) => tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, at);

      // hidden at the start

      tl.fromTo("#tt-kicker", { opacity: 0 }, { opacity: 1, duration: 0.4 }, CUE.intro);
      // title word by word
      tl.fromTo("#tt-title", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, CUE.intro + 0.3);
      tl.fromTo("#tt-panel", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power4.out" }, CUE.intro + 1.2);

      // 1. route_report
      show("#tt-b0", CUE.route, { scale: 0.96, y: 0 });
      show("#tt-b0-args", CUE.route + 0.5, { x: -12, y: 0 });
      show("#tt-s-route", CUE.route + 0.3, { x: 30, y: 0 });
      tl.fromTo("#tt-trunk", { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power2.inOut" }, CUE.route + 0.5);
      tl.set(".tt-owner", { opacity: 0.25 }, CUE.route + 0.3);
      [
        ["#tt-o0", CUE.council],
        ["#tt-o1", CUE.highways],
        ["#tt-o2", CUE.police],
        ["#tt-o3", CUE.dvla],
        ["#tt-o4", CUE.landowner],
      ].forEach(([o, at]) => {
        tl.fromTo(o, { opacity: 0.25, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, at);
        tl.fromTo(o + " .tt-pill", { color: "#a0aa98" }, { color: "#eef5e6", duration: 0.3 }, at);
      });
      // the result: Sheffield City Council owns Crookes Road
      show("#tt-b0-res", CUE.council + 0.4, { x: -12, y: 0 });
      tl.fromTo(["#tt-o1", "#tt-o2", "#tt-o3", "#tt-o4"], { opacity: 1 }, { opacity: 0.35, duration: 0.3, immediateRender: false }, CUE.landowner + 0.5);
      tl.fromTo("#tt-o0 .tt-pill", { backgroundColor: "#141c11", color: "#eef5e6" }, { backgroundColor: "#76b900", color: "#0b0f0a", duration: 0.3 }, CUE.council + 0.4);

      // 2. assess_pothole
      hide("#tt-b0", CUE.assess - 0.1);
      show("#tt-r0", CUE.assess - 0.1, { y: 0 });
      hide("#tt-s-route", CUE.assess - 0.1);
      show("#tt-b1", CUE.assess, { scale: 0.96, y: 0 });
      show("#tt-b1-args", CUE.assess + 0.4, { x: -12, y: 0 });
      show("#tt-s-assess", CUE.assess + 0.2, { x: 30, y: 0 });
      tl.set(["#tt-cat", "#tt-thresh-l"], { opacity: 0 }, CUE.assess);
      tl.fromTo("#tt-barfill", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power2.out" }, CUE.depth);
      show("#tt-thresh-l", CUE.depth + 0.4);
      show("#tt-b1-res", CUE.depth + 0.2, { x: -12, y: 0 });
      show("#tt-cat", CUE.depth + 0.8, { scale: 0.9, y: 0 });

      // 3. file_report
      hide("#tt-b1", CUE.file - 0.1);
      show("#tt-r1", CUE.file - 0.1, { y: 0 });
      hide("#tt-s-assess", CUE.file - 0.1);
      show("#tt-b2", CUE.file, { scale: 0.96, y: 0 });
      show("#tt-b2-args", CUE.file + 0.4, { x: -12, y: 0 });
      show("#tt-s-file", CUE.fields, { x: 30, y: 0 });
      tl.set(["#tt-refval", "#tt-refnote"], { opacity: 0 }, CUE.file);
      show("#tt-b2-res", CUE.reference, { x: -12, y: 0 });
      show("#tt-refval", CUE.reference + 0.2, { scale: 0.9, y: 0 });
      show("#tt-refnote", CUE.reference + 0.5);

      // 4. tool error -> back to the model -> retry
      hide("#tt-b2", CUE.loop - 0.1);
      show("#tt-r2", CUE.loop - 0.1, { y: 0 });
      tl.fromTo("#tt-loop", { opacity: 0 }, { opacity: 1, duration: 0.3 }, CUE.loop);
      tl.set(["#tt-lmodel", "#tt-ltool", "#tt-lerr", "#tt-lback", "#tt-lcap"], { opacity: 0 }, CUE.loop - 0.2);
      tl.set(["#tt-la1", "#tt-la2"], { scaleX: 0 }, CUE.loop - 0.2);
      show("#tt-lmodel", CUE.loop, { scale: 0.9, y: 0 });
      tl.fromTo("#tt-la1", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.inOut" }, CUE.loop + 0.4);
      show("#tt-ltool", CUE.loop + 0.6, { scale: 0.9, y: 0 });
      tl.fromTo("#tt-la2", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.inOut" }, CUE.loop + 1.0);
      show("#tt-lerr", CUE.loop + 1.2, { scale: 0.9, y: 0 });
      tl.fromTo("#tt-lback", { opacity: 0 }, { opacity: 1, duration: 0.1 }, CUE.backToModel);
      tl.fromTo("#tt-lback-path", { strokeDasharray: 900, strokeDashoffset: 900 }, { strokeDasharray: 900, strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, CUE.backToModel);
      tl.fromTo("#tt-lback-head", { opacity: 0 }, { opacity: 1, duration: 0.2 }, CUE.backToModel + 0.9);
      show("#tt-lcap", CUE.backToModel + 0.8);
      tl.fromTo("#tt-lmodel", { scale: 1 }, { scale: 1.08, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.out" }, CUE.correct);

      // 5. every step logged
      show("#tt-logged", CUE.logged, { y: 20 });
      tl.fromTo("#tt-r0", { borderColor: "rgba(118,185,0,0)" }, { borderColor: "rgba(118,185,0,1)", duration: 0.3 }, CUE.why + 0.4);
      tl.fromTo("#tt-r0", { boxShadow: "0 0 0 0 rgba(118,185,0,0.6)" }, { boxShadow: "0 0 0 10px rgba(118,185,0,0)", duration: 0.8 }, CUE.why + 0.4);
      window.__timelines["tool-trace"] = tl;
    })();
  </script>
</template>
