  <script>
    (function () {
      const CUE = {
        c02a: 0.40, //    VO 02a handler: "Potholes? ... report that online, love. It's form X."
        phone: 3.00, //   beat: "online": the phone comes up
        scroll: 5.00, //  beat: the 24 service categories scroll past, no "Report" anywhere
        c02b: 7.92, //    VO 02b Irene: "Form X? What's form X?"
        tap: 10.00, //    beat: she taps "Roads and pavements"
        roads: 10.50, //  beat: the Roads and pavements page
        c02c: 11.80, //   VO 02c Irene: "Report a problem with a road…"
        link2: 11.90, //  beat: "Report a problem with a road" highlighted
        link7: 14.10, //  beat: "…or report road and pavement problems?" highlighted
        whichOne: 15.90, // beat: "Which one's form X?": face drops
      };
      const tl = gsap.timeline({ paused: true });
      // Rows are 76 px under the page header: this scroll leaves "Roads and pavements" (row 19) under the tap ring.
      const SCROLL_TO_ROADS = -1240;

      // Hold clock races while the handler talks
      const hold = { s: 0 };
      const drawHold = () => {
        const v = Math.floor(hold.s);
        document.querySelector("#fx-holdtime").textContent =
          String(Math.floor(v / 60)).padStart(2, "0") + ":" + String(v % 60).padStart(2, "0");
      };
      tl.fromTo("#fx-hold", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.3 }, 0);
      tl.fromTo(hold, { s: 41 }, { s: 20 * 60 + 14, duration: 3.0, ease: "power1.in", onUpdate: drawHold }, CUE.c02a);

      // 02a: handler bubble, then the phone
      tl.fromTo("#fx-irene", { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo("#fx-say-handler", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, CUE.c02a);
      tl.fromTo("#fx-phone", { y: 300, opacity: 0, rotation: 4 }, { y: 0, opacity: 1, rotation: 0, duration: 0.8, ease: "expo.out" }, CUE.phone);

      // the categories scroll past
      tl.fromTo("#fx-home", { y: 0 }, { y: SCROLL_TO_ROADS, duration: 4.6, ease: "power1.inOut" }, CUE.scroll);

      // 02b: Irene reacts: brows up, mouth "o", her bubble
      tl.fromTo("#fx-say-handler", { opacity: 1 }, { opacity: 0, duration: 0.25, immediateRender: false }, CUE.c02b - 0.3);
      tl.fromTo(["#fx-brow-l", "#fx-brow-r"], { y: 0 }, { y: -16, duration: 0.25, ease: "power3.out" }, CUE.c02b);
      tl.fromTo("#fx-mouth-flat", { opacity: 1 }, { opacity: 0, duration: 0.1 }, CUE.c02b);
      tl.fromTo("#fx-mouth-o", { opacity: 0 }, { opacity: 1, duration: 0.1 }, CUE.c02b);
      tl.fromTo("#fx-head", { rotation: 0 }, { rotation: 6, duration: 0.3, ease: "power2.out" }, CUE.c02b);
      tl.fromTo("#fx-say-irene", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, CUE.c02b);

      // tap "Roads and pavements", the page changes
      tl.fromTo("#fx-tap", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, CUE.tap);
      tl.fromTo("#fx-cat-roads", { backgroundColor: "rgba(243,163,0,0)" }, { backgroundColor: "rgba(243,163,0,0.3)", duration: 0.15 }, CUE.tap + 0.1);
      tl.to("#fx-tap", { opacity: 0, scale: 1.3, duration: 0.25 }, CUE.roads - 0.1);
      tl.fromTo("#fx-home", { opacity: 1, x: 0 }, { opacity: 0, x: -120, duration: 0.3, ease: "power2.in", immediateRender: false }, CUE.roads);
      tl.fromTo("#fx-roads", { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, CUE.roads + 0.2);

      // 02c: the two near-identical links, in turn
      tl.fromTo("#fx-say-irene", { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, CUE.c02c - 0.2);
      tl.fromTo("#fx-l2", { backgroundColor: "rgba(243,163,0,0)" }, { backgroundColor: "rgba(243,163,0,0.35)", duration: 0.3 }, CUE.link2);
      tl.fromTo("#fx-l7", { backgroundColor: "rgba(243,163,0,0)" }, { backgroundColor: "rgba(243,163,0,0.35)", duration: 0.3 }, CUE.link7);
      tl.fromTo("#fx-phone", { x: 0 }, { x: 8, duration: 0.06, yoyo: true, repeat: 3, immediateRender: false }, CUE.link7);
      tl.fromTo("#fx-qm1", { opacity: 0, scale: 0.4, rotation: -20 }, { opacity: 1, scale: 1, rotation: -10, duration: 0.35, ease: "back.out(2)" }, CUE.link7 + 0.2);
      tl.fromTo("#fx-qm2", { opacity: 0, scale: 0.4, rotation: 20 }, { opacity: 1, scale: 1, rotation: 12, duration: 0.35, ease: "back.out(2)" }, CUE.link7 + 0.9);

      // "Which one's form X?": face drops
      tl.fromTo("#fx-say-irene2", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, CUE.whichOne);
      tl.fromTo("#fx-qm3", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.35, ease: "back.out(2)" }, CUE.whichOne + 0.2);
      tl.fromTo("#fx-mouth-o", { opacity: 1 }, { opacity: 0, duration: 0.15, immediateRender: false }, CUE.whichOne);
      tl.fromTo("#fx-mouth-sad", { opacity: 0 }, { opacity: 1, duration: 0.15 }, CUE.whichOne);
      tl.fromTo(["#fx-brow-l", "#fx-brow-r"], { y: -16, rotation: 0 }, { y: 4, rotation: (i) => (i ? -14 : 14), duration: 0.4, ease: "power2.out", immediateRender: false }, CUE.whichOne);
      tl.fromTo("#fx-head", { rotation: 6, y: 0 }, { rotation: -4, y: 26, duration: 0.8, ease: "power2.inOut", immediateRender: false }, CUE.whichOne);
      tl.fromTo("#fx-sweat", { opacity: 0, y: 0 }, { opacity: 1, y: 40, duration: 1.4, ease: "power1.in" }, CUE.whichOne + 0.2);
      window.__timelines["form-x"] = tl;
    })();
