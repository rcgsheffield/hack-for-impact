  <script>
    (function () {
      // Scene-local seconds. Retime by editing these numbers only.
      const CUE = {
        c02a: 0.40, //   VO 02a handler: "Potholes? ... It's form X."
        formx: 5.98, //  beat: "form X" spoken, form window slides in
        c02b: 7.92, //   VO 02b Irene: "Form X? What's form X?"
        c02c: 10.21, //   VO 02c narrator: "Twenty minutes on hold, then a website..."
        q1: 12.51, //    beat: "Is it a road or a pavement?"
        q2: 13.99, //    beat: "How deep is it, in millimetres?"
        q3: 15.79, //    beat: "Who even owns this road?"
        drop: 16.61, //  beat: Irene's face drops, forms multiply
        stamp: 18.09, // beat: ERROR 422
      };
      const tl = gsap.timeline({ paused: true });

      // Hold clock races to 20:14 (pays off "twenty minutes on hold" in 02c)
      const hold = { s: 0 };
      const drawHold = () => {
        const v = Math.floor(hold.s);
        document.querySelector("#fx-holdtime").textContent =
          String(Math.floor(v / 60)).padStart(2, "0") + ":" + String(v % 60).padStart(2, "0");
      };
      tl.fromTo("#fx-hold", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.3 }, 0);
      tl.fromTo(hold, { s: 41 }, { s: 20 * 60 + 14, duration: 3.0, ease: "power1.in", onUpdate: drawHold }, CUE.c02a);

      // 02a: handler bubble
      tl.fromTo("#fx-irene", { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo("#fx-say-handler", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, CUE.c02a);
      tl.fromTo("#fx-winx", { x: 240, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, CUE.formx);

      // 02b: Irene reacts: brows up, mouth "o", her bubble
      tl.fromTo(["#fx-brow-l", "#fx-brow-r"], { y: 0 }, { y: -16, duration: 0.25, ease: "power3.out" }, CUE.c02b);
      tl.fromTo("#fx-mouth-flat", { opacity: 1 }, { opacity: 0, duration: 0.1 }, CUE.c02b);
      tl.fromTo("#fx-mouth-o", { opacity: 0 }, { opacity: 1, duration: 0.1 }, CUE.c02b);
      tl.fromTo("#fx-head", { rotation: 0 }, { rotation: 6, duration: 0.3, ease: "power2.out" }, CUE.c02b);
      tl.fromTo("#fx-say-irene", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, CUE.c02b);

      // 02c: bubbles clear, the form scrolls, questions pop as they are spoken
      tl.fromTo(["#fx-say-handler", "#fx-say-irene"], { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, CUE.c02c);
      tl.fromTo("#fx-scrollx", { y: 0 }, { y: -720, duration: CUE.q3 - CUE.c02c + 0.6, ease: "power1.inOut" }, CUE.c02c);
      tl.fromTo(".fx-err .fx-box", { backgroundColor: "#ffffff" }, { backgroundColor: "#fde7e7", duration: 0.2, stagger: 0.5 }, CUE.c02c + 0.6);
      [["#fx-q1", "#fx-f1", CUE.q1], ["#fx-q2", "#fx-f2", CUE.q2], ["#fx-q3", "#fx-f3", CUE.q3]].forEach(([q, f, at]) => {
        tl.fromTo(q, { opacity: 0, x: -40, rotation: -3 }, { opacity: 1, x: 0, rotation: -2, duration: 0.4, ease: "expo.out" }, at);
        tl.fromTo(f + " .fx-box", { backgroundColor: "#ffffff" }, { backgroundColor: "#fff3cc", duration: 0.3 }, at);
      });

      // Irene's face drops; the forms multiply
      tl.fromTo("#fx-mouth-o", { opacity: 1 }, { opacity: 0, duration: 0.15, immediateRender: false }, CUE.drop);
      tl.fromTo("#fx-mouth-sad", { opacity: 0 }, { opacity: 1, duration: 0.15 }, CUE.drop);
      tl.fromTo(["#fx-brow-l", "#fx-brow-r"], { y: -16, rotation: 0 }, { y: 4, rotation: (i) => (i ? -14 : 14), duration: 0.4, ease: "power2.out", immediateRender: false }, CUE.drop);
      tl.fromTo("#fx-head", { rotation: 6, y: 0 }, { rotation: -4, y: 26, duration: 0.8, ease: "power2.inOut", immediateRender: false }, CUE.drop);
      tl.fromTo("#fx-sweat", { opacity: 0, y: 0 }, { opacity: 1, y: 40, duration: 1.4, ease: "power1.in" }, CUE.drop + 0.2);
      tl.fromTo("#fx-winx", { rotation: 0 }, { rotation: -2, duration: 0.3 }, CUE.drop);
      tl.fromTo("#fx-winy", { y: 300, opacity: 0 }, { y: 0, opacity: 1, rotation: 1.5, duration: 0.6, ease: "expo.out" }, CUE.drop);
      tl.fromTo("#fx-winz", { y: 300, opacity: 0 }, { y: 0, opacity: 1, rotation: -1, duration: 0.6, ease: "expo.out" }, CUE.drop + 0.7);
      tl.fromTo("#fx-stamp", { scale: 2.4, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: -8, duration: 0.3, ease: "power4.in" }, CUE.stamp);
      tl.fromTo(".fx-win", { x: 0 }, { x: 10, duration: 0.05, yoyo: true, repeat: 5, immediateRender: false }, CUE.stamp + 0.3);
      window.__timelines["form-x"] = tl;
    })();
  </script>
