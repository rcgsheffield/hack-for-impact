        vo10: 0.50, // "Under the hood,"
        agent: 1.97, // "a LangChain agent"
        nemotron: 3.08, // "runs NVIDIA Nemotron,"
        ollama: 4.55, // "served by Ollama"

        tools: 6.76, // "Its tools"
        toolRoute: 7.50, // "route reports,"
        toolForms: 8.23, // "fill in forms"
        toolBrowser: 9.70, // "and drive a browser."
        triage: 10.10, // (beat) triage and dashboard complete the pipeline
        noCloud: 11.54, // "There are no cloud APIs,"
        neverLeave: 12.64, // "so residents' personal data never leaves the machine."
        open311: 15.60, // "And it's built on Open311,"
        fms: 18.50, // "the open standard behind FixMyStreet,"
        designed: 20.00, // "so it's designed to plug into"
        caseSys: 21.50, // "council systems without a custom build each time."

      const IN = { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" };

      tl.fromTo("#af-kicker", { opacity: 0 }, { opacity: 1, duration: 0.4 }, CUE.vo10);
      tl.fromTo("#af-title", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, CUE.vo10 + 0.2);

      // resident -> web app
      tl.fromTo("#af-res", { opacity: 0, y: 30 }, IN, CUE.vo10 + 0.4);
      grow("#af-a1", CUE.vo10 + 0.8);
      tl.fromTo("#af-app", { opacity: 0, y: 30 }, IN, CUE.vo10 + 1.0);

      // agent + model
      grow("#af-a2", CUE.agent - 0.3);
      tl.fromTo("#af-model", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, CUE.agent);
      tl.fromTo("#af-model-name", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, CUE.nemotron);
      tl.fromTo("#af-ollama", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, CUE.ollama);

      // DGX Spark boundary
      tl.fromTo("#af-spark", { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, CUE.spark);
      tl.fromTo("#af-spark-label", { opacity: 0 }, { opacity: 1, duration: 0.4 }, CUE.spark + 0.4);

      // tools

      tl.fromTo("#af-tools", { opacity: 0, y: 30 }, IN, CUE.tools);

        tl.fromTo(sel, { backgroundColor: "#1f2a19", color: "#cfe3b8" }, { backgroundColor: "#76b900", color: "#0b0f0a", duration: 0.2 }, at + 0.1);
        tl.fromTo(sel, { backgroundColor: "#76b900", color: "#0b0f0a" }, { backgroundColor: "#1f2a19", color: "#cfe3b8", duration: 0.4, immediateRender: false }, at + 0.7);
      });
      tl.fromTo("#af-tools .af-sub", { opacity: 0 }, { opacity: 1, duration: 0.3 }, CUE.toolBrowser + 0.2);

      // triage + dashboard
      grow("#af-a4", CUE.triage);
      tl.fromTo("#af-triage", { opacity: 0, y: 30 }, IN, CUE.triage + 0.2);
      grow("#af-a5", CUE.triage + 0.6);
      tl.fromTo("#af-dash", { opacity: 0, y: 30 }, IN, CUE.triage + 0.8);

      // no cloud APIs
      tl.fromTo("#af-cloud", { opacity: 0 }, { opacity: 1, duration: 0.4 }, CUE.noCloud);
      tl.fromTo("#af-cloud-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, CUE.noCloud + 0.5);
      tl.fromTo("#af-spark-label", { scale: 1 }, { scale: 1.06, duration: 0.25, yoyo: true, repeat: 1, transformOrigin: "0% 50%" }, CUE.noCloud + 0.5);

      // never leaves the machine: a packet travels resident -> dashboard and stays inside the box
      tl.fromTo("#af-packet", { opacity: 0, x: 0 }, { opacity: 1, x: 0, duration: 0.2 }, CUE.neverLeave);
      tl.fromTo("#af-packet", { x: 0 }, { x: 1335, duration: 2.2, ease: "power1.inOut", immediateRender: false }, CUE.neverLeave + 0.2);
      tl.fromTo("#af-packet", { opacity: 1 }, { opacity: 0, duration: 0.3, immediateRender: false }, CUE.neverLeave + 2.4);
      tl.fromTo("#af-stay", { opacity: 0, y: 20 }, IN, CUE.neverLeave + 0.3);
      tl.fromTo("#af-dash", { borderColor: "#3a4a30" }, { borderColor: "#76b900", duration: 0.3 }, CUE.neverLeave + 2.3);

      // Open311 interoperability strip
      tl.fromTo("#af-strip", { opacity: 0, y: 24 }, IN, CUE.open311);
      tl.fromTo("#af-o311", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.8)" }, CUE.open311 + 0.2);
      tl.fromTo("#af-s1", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, CUE.fms);
      tl.fromTo("#af-sa1", { opacity: 0 }, { opacity: 1, duration: 0.3 }, CUE.fms + 0.5);
      tl.fromTo("#af-s2", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, CUE.designed);
      tl.fromTo("#af-sa2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, CUE.caseSys - 0.3);
      tl.fromTo("#af-s3", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, CUE.caseSys);
      tl.fromTo("#af-strip", { borderColor: "#3a4a30" }, { borderColor: "#76b900", duration: 0.4 }, CUE.caseSys + 0.6);
