    (function () {
      // Scene 09, clip 09. Times in seconds from scene start (global 165 s).
      // Estimates at ~2.6 spoken words/s with the clip starting at 0.5 s; retime by editing these numbers.
      const CUE = {
        howWork: 0.50, // "So how does it work?"
        openModel: 2.89, // "CouncilTriagent runs an open model,"
        nemotron: 5.66, // "NVIDIA Nemotron,"
        ollama: 6.79, // "served by Ollama"
        spark: 8.43, // "on an NVIDIA DGX Spark."
        noCloud: 10.69, // "There are no cloud APIs,"
        neverLeave: 13.09, // "so residents' reports never leave the machine."
        tools: 16.53, // (music) the three tools light up
        record: 17.65, // (music) the council-ready record
        flow: 18.55, // (music) one report travels the whole pipeline
        handoff: 22.38, // (music) tools pulse as the hand-off to scene 10
      };
      const tl = gsap.timeline({ paused: true });
      const IN = { opacity: 1, y: 0, duration: 0.6, ease: "power4.out" };

      tl.fromTo("#af-kicker", { opacity: 0 }, { opacity: 1, duration: 0.4 }, CUE.howWork);
      tl.fromTo("#af-title", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, CUE.howWork + 0.2);

      // resident -> chat UI
      tl.fromTo("#af-res", { opacity: 0, y: 30 }, IN, CUE.howWork + 0.6);
      tl.fromTo("#af-a1", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.inOut" }, CUE.openModel - 0.4);
      tl.fromTo("#af-chat", { opacity: 0, y: 30 }, IN, CUE.openModel);

      // model
      tl.fromTo("#af-a2", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.inOut" }, CUE.nemotron - 0.4);
      tl.fromTo("#af-model", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, CUE.nemotron);
      tl.fromTo("#af-ollama", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, CUE.ollama);

      // DGX Spark boundary
      tl.fromTo("#af-spark", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, CUE.spark);
      tl.fromTo("#af-spark-label", { opacity: 0 }, { opacity: 1, duration: 0.4 }, CUE.spark + 0.4);

      // no cloud APIs
      tl.fromTo("#af-cloud", { opacity: 0 }, { opacity: 1, duration: 0.4 }, CUE.noCloud);
      tl.fromTo("#af-cloud-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, CUE.noCloud + 0.6);
      tl.fromTo("#af-spark-label", { scale: 1 }, { scale: 1.06, duration: 0.25, yoyo: true, repeat: 1, transformOrigin: "0% 50%" }, CUE.noCloud + 0.6);

      // never leave the machine: the packet goes resident -> model and stays inside the box
      tl.fromTo("#af-packet", { opacity: 0, x: 0 }, { opacity: 1, x: 0, duration: 0.2 }, CUE.neverLeave);
      tl.fromTo("#af-packet", { x: 0 }, { x: 640, duration: 1.4, ease: "power2.inOut", immediateRender: false }, CUE.neverLeave + 0.2);
      tl.fromTo("#af-stay", { opacity: 0, y: 20 }, IN, CUE.neverLeave + 0.4);

      // tools and record
      tl.fromTo("#af-a3", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.inOut" }, CUE.tools - 0.4);
      tl.fromTo("#af-tools", { opacity: 0, y: 30 }, IN, CUE.tools);
      tl.fromTo(".af-tool", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, stagger: 0.12, ease: "power3.out" }, CUE.tools + 0.3);
      tl.fromTo("#af-a4", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.inOut" }, CUE.record - 0.4);
      tl.fromTo("#af-record", { opacity: 0, y: 30 }, IN, CUE.record);

      // the packet carries on through the tools to the record
      tl.fromTo("#af-packet", { x: 640 }, { x: 1010, duration: 1.0, ease: "power2.inOut", immediateRender: false }, CUE.flow);
      ["#af-t1", "#af-t2", "#af-t3"].forEach((t, i) => {
        tl.fromTo(t, { backgroundColor: "#1f2a19", color: "#cfe3b8" }, { backgroundColor: "#76b900", color: "#0b0f0a", duration: 0.25 }, CUE.flow + 1.0 + i * 0.5);
      });
      tl.fromTo("#af-packet", { x: 1010 }, { x: 1320, duration: 0.9, ease: "power2.inOut", immediateRender: false }, CUE.flow + 2.6);
      tl.fromTo("#af-packet", { opacity: 1 }, { opacity: 0, duration: 0.3, immediateRender: false }, CUE.flow + 3.5);
      tl.fromTo("#af-record", { borderColor: "#3a4a30" }, { borderColor: "#76b900", duration: 0.3 }, CUE.flow + 3.4);
      tl.fromTo("#af-ref", { opacity: 0.4 }, { opacity: 1, duration: 0.3 }, CUE.flow + 3.4);

      // hand-off: the tools node takes focus
      tl.fromTo("#af-tools", { borderColor: "#3a4a30" }, { borderColor: "#76b900", duration: 0.4 }, CUE.handoff);
      tl.fromTo("#af-tools", { scale: 1 }, { scale: 1.05, duration: 0.6, ease: "power3.out" }, CUE.handoff);
      window.__timelines["agent-flow"] = tl;
    })();
  </script>
