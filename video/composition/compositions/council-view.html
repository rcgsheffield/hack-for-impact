        vo08: 0.50, // 08 worker: "Location, depth, priority, all in the right fields."

        vo08b: 5.60, // 08b narrator: "Every report arrives triaged,"

        low: 7.90, // 08b "to Low,"
        reasons: 8.88, // 08b "with the reasons in plain English."

        moves: 16.75, // 08b "one job that moves up the queue,"
        emails: 18.06, // 08b "not three emails."

      const tl = gsap.timeline({ paused: true });

      // phase 1: the worker with Irene's report
      tl.fromTo("#cv-k1", { opacity: 0 }, { opacity: 1, duration: 0.4 }, CUE.enter);

      tl.fromTo("#cv-queue", { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, CUE.enter + 0.2);
      tl.fromTo(".cv-f", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.25, stagger: 0.04, ease: "power3.out" }, CUE.enter + 0.3);

      const mark = (sel, at) =>
        tl.fromTo(sel, { backgroundColor: "rgba(118,185,0,0)" }, { backgroundColor: "rgba(118,185,0,0.28)", duration: 0.25, ease: "power2.out" }, at);
      mark("#cv-f-loc", CUE.fLoc);

      tl.fromTo("#cv-worker", { y: 20, rotation: 0 }, { y: 0, rotation: -3, duration: 0.8, ease: "power2.inOut", immediateRender: false }, CUE.relax);
      tl.fromTo("#cv-flat", { opacity: 1 }, { opacity: 0, duration: 0.2 }, CUE.relax + 0.2);
      tl.fromTo("#cv-smile", { opacity: 0 }, { opacity: 1, duration: 0.25 }, CUE.relax + 0.2);

      // phase 2: the dashboard

      tl.fromTo("#cv-k2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, CUE.swap + 0.25);
      tl.fromTo("#cv-t2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, CUE.swap + 0.3);

      tl.fromTo("#cv-p6", { scale: 1 }, { scale: 1.12, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out" }, CUE.low);
      tl.fromTo("#cv-queue .cv-why:not(#cv-w5b)", { backgroundColor: "rgba(118,185,0,0)" }, { backgroundColor: "rgba(118,185,0,0.25)", duration: 0.3, stagger: 0.06, ease: "power2.out" }, CUE.reasons);
      tl.fromTo("#cv-queue .cv-why:not(#cv-w5b)", { backgroundColor: "rgba(118,185,0,0.25)" }, { backgroundColor: "rgba(118,185,0,0)", duration: 0.5, immediateRender: false }, CUE.reasons + 1.4);

      // the map: pins drop, three merge into one group
      tl.fromTo("#cv-map", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, CUE.mapIn);
      tl.fromTo(".cv-pin", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08, ease: "bounce.out" }, CUE.mapIn + 0.2);
      tl.fromTo("#cv-ring", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, CUE.grouped);
      tl.fromTo("#cv-ring", { opacity: 1 }, { opacity: 0, duration: 0.3, immediateRender: false }, CUE.cluster);
      tl.fromTo(["#cv-d1", "#cv-d2", "#cv-d3"], { scale: 1 }, { scale: 1.3, duration: 0.2, yoyo: true, repeat: 1, stagger: 0.1 }, CUE.three);
      tl.fromTo("#cv-d1", { x: 0, y: 0 }, { x: 37, y: 37, duration: 0.5, ease: "power3.inOut", immediateRender: false }, CUE.merge);
      tl.fromTo("#cv-d2", { x: 0, y: 0 }, { x: -38, y: 12, duration: 0.5, ease: "power3.inOut", immediateRender: false }, CUE.merge);
      tl.fromTo("#cv-d3", { x: 0, y: 0 }, { x: 7, y: -38, duration: 0.5, ease: "power3.inOut", immediateRender: false }, CUE.merge);
      tl.fromTo(["#cv-d1", "#cv-d2", "#cv-d3"], { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, CUE.cluster);
      tl.fromTo("#cv-cluster", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, CUE.cluster);
      tl.fromTo("#cv-cluster-label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35 }, CUE.cluster + 0.2);
      tl.fromTo("#cv-r5", { borderColor: "#cfd5de" }, { borderColor: "#e65100", duration: 0.3 }, CUE.cluster + 0.2);

      // the group's row moves up the queue: P3 to P2

      tl.fromTo("#cv-r4", { y: 0 }, { y: ROW, duration: 0.7, ease: "power3.inOut" }, CUE.moves);
      tl.fromTo("#cv-p5a", { opacity: 1 }, { opacity: 0, duration: 0.25 }, CUE.moves + 0.3);
      tl.fromTo("#cv-p5b", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, CUE.moves + 0.35);
      tl.fromTo("#cv-w5a", { opacity: 1 }, { opacity: 0, duration: 0.25 }, CUE.moves + 0.3);
      tl.fromTo("#cv-w5b", { opacity: 0 }, { opacity: 1, duration: 0.3 }, CUE.moves + 0.4);

      tl.fromTo("#cv-count", { scale: 1 }, { scale: 1.12, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, CUE.emails + 0.3);
