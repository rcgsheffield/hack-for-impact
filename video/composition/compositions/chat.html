  <script>
    (function () {
      // Seconds from scene start, set against the real clip lengths (tools/retime.py keeps them in step).
      const CUE = {
        enter: 0.00, // window slides in
        vo06a: 0.60, // 06a narrator: "Now Irene just tells the agent what's wrong."
        vo06b: 3.25, // 06b Irene: her message appears
        think1: 8.99, // agent typing dots
        vo06c: 9.79, // 06c agent: "Sorry to hear that, Irene. Roughly how deep is it?"
        vo06d: 14.00, // 06d Irene: "About ten centimetres."
        vo06e: 15.60, // caption swaps to "Behind the scenes" (no voice since 06e was cut)
        toolRoute: 16.00, // route_report chip
        toolAssess: 16.90, // assess_pothole chip
        toolFile: 17.80, // file_report chip, then typing dots
        vo06f: 19.60, // 06f agent: confirmation with reference
        ref: 25.40, // 06f "…your reference is on screen"
        urgent: 32.10, // 06f "…so it's marked as an emergency"
        vo06g: 38.00, // 06g narrator: "No forms. No hold music…"
      };
      // Feed scroll offsets (px) so the newest item stays above the composer.
      const SCROLL = { tools: -150, file: -230, done: -370 };

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#ch-b1", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, CUE.enter + 0.1);
      tl.fromTo("#ch-win", { y: 200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, CUE.enter + 0.2);
      tl.set(["#ch-b2", "#ch-b3", "#ch-b4", "#ch-m1", "#ch-t1", "#ch-m2", "#ch-m3", "#ch-c1", "#ch-c2", "#ch-c3", "#ch-t2", "#ch-done", "#ch-badge"], { opacity: 0 }, 0);

      const pop = (sel, at) =>
        tl.fromTo(sel, { opacity: 0, y: 30, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "power3.out" }, at);
      const send = (at) => tl.fromTo("#ch-send", { scale: 1 }, { scale: 0.85, duration: 0.1, yoyo: true, repeat: 1 }, at);
      const swap = (from, to, at) => {
        tl.fromTo(from, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.18 }, at);
        tl.fromTo(to, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, at + 0.15);
      };
      const typing = (sel, from, to) => {
        pop(sel, from);
        const n = Math.max(1, Math.floor((to - from - 0.3) / 0.5));
        tl.fromTo(sel + " .ch-dot", { y: 0 }, { y: -10, duration: 0.25, yoyo: true, repeat: n * 2 - 1, stagger: 0.1, ease: "sine.inOut" }, from + 0.2);
        tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: 0.12 }, to - 0.1);
      };
      let feedY = 0;
      const scroll = (y, at) => {
        tl.fromTo("#ch-feed", { y: feedY }, { y, duration: 0.6, ease: "power2.inOut", immediateRender: false }, at);
        feedY = y;
      };

      // 06b Irene's message
      send(CUE.vo06b);
      pop("#ch-m1", CUE.vo06b + 0.1);
      // 06c agent asks for depth
      typing("#ch-t1", CUE.think1, CUE.vo06c);
      pop("#ch-m2", CUE.vo06c);
      // 06d Irene answers
      send(CUE.vo06d);
      pop("#ch-m3", CUE.vo06d + 0.1);
      // 06e tools run
      swap("#ch-b1", "#ch-b2", CUE.vo06e);
      scroll(SCROLL.tools, CUE.toolRoute - 0.3);
      pop("#ch-c1", CUE.toolRoute);
      pop("#ch-c2", CUE.toolAssess);
      scroll(SCROLL.file, CUE.toolFile - 0.3);
      pop("#ch-c3", CUE.toolFile);
      typing("#ch-t2", CUE.toolFile + 0.4, CUE.vo06f);
      // 06f confirmation
      scroll(SCROLL.done, CUE.vo06f - 0.3);
      pop("#ch-done", CUE.vo06f);
      swap("#ch-b2", "#ch-b3", CUE.vo06f);
      tl.fromTo("#ch-done", { boxShadow: "0 0 0 0 rgba(118,185,0,0.6)" }, { boxShadow: "0 0 0 24px rgba(118,185,0,0)", duration: 0.9 }, CUE.vo06f + 0.3);
      tl.fromTo("#ch-ref", { backgroundColor: "rgba(118,185,0,0)" }, { backgroundColor: "rgba(118,185,0,0.35)", duration: 0.3, ease: "power2.out" }, CUE.ref);
      tl.fromTo("#ch-badge", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, CUE.urgent);
      // 06g caption
      swap("#ch-b3", "#ch-b4", CUE.vo06g);
      window.__timelines["chat"] = tl;
    })();
  </script>
