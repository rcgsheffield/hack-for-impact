    (function () {
      // Seconds from scene start. Voice clips are estimates (~2.6 words/s); retime by editing these.
      const CUE = {
        enter: 0.00, // hard cut: same chat window, Irene's first report still on screen
        vo07a: 0.60, // 07a narrator: "And when it isn't the council's problem…"
        vo07b: 6.60, // 07b Irene: "There's another one on the Stocksbridge Bypass."
        toolRoute: 9.50, // route_report chip → National Highways
        think: 10.00, // agent typing dots
        vo07c: 10.80, // 07c agent: "The Stocksbridge Bypass is run by National Highways…"
        contact: 20.39, // contact pill glows at 07c "…report it on the National Highways website"
      };
      // Feed scroll offsets (px) so the newest item stays above the composer.
      const SCROLL = { start: 0, chip: 0, reply: -230 };

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#cr-b1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, CUE.vo07a);
      tl.set(["#cr-m1", "#cr-c1", "#cr-t1", "#cr-done"], { opacity: 0 }, 0);

      const pop = (sel, at) =>
        tl.fromTo(sel, { opacity: 0, y: 30, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "power3.out" }, at);
      const send = (at) => tl.fromTo("#cr-send", { scale: 1 }, { scale: 0.85, duration: 0.1, yoyo: true, repeat: 1 }, at);
      const typing = (sel, from, to) => {
        pop(sel, from);
        const n = Math.max(1, Math.floor((to - from - 0.3) / 0.5));
        tl.fromTo(sel + " .cr-dot", { y: 0 }, { y: -10, duration: 0.25, yoyo: true, repeat: n * 2 - 1, stagger: 0.1, ease: "sine.inOut" }, from + 0.2);
        tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: 0.12 }, to - 0.1);
      };
      let feedY = SCROLL.start;
      tl.fromTo("#cr-feed", { y: SCROLL.start }, { y: SCROLL.start, duration: 0.01 }, 0);
      const scroll = (y, at) => {
        tl.fromTo("#cr-feed", { y: feedY }, { y, duration: 0.6, ease: "power2.inOut", immediateRender: false }, at);
        feedY = y;
      };

      // 07b Irene's second report
      send(CUE.vo07b);
      pop("#cr-m1", CUE.vo07b + 0.1);
      // route_report says it's not the council's
      pop("#cr-c1", CUE.toolRoute);
      tl.fromTo("#cr-c1", { borderColor: "#76b900" }, { borderColor: "#c9d8b4", duration: 0.8 }, CUE.toolRoute + 0.35);
      typing("#cr-t1", CUE.think, CUE.vo07c);
      // 07c agent explains and points to National Highways
      scroll(SCROLL.reply, CUE.vo07c - 0.3);
      pop("#cr-done", CUE.vo07c);
      tl.fromTo("#cr-contact", { boxShadow: "0 0 0 0 rgba(118,185,0,0.7)" }, { boxShadow: "0 0 0 18px rgba(118,185,0,0)", duration: 0.9 }, CUE.contact);
      window.__timelines["chat-routing"] = tl;
    })();
