  <script>
    (function () {
      // Scene-local seconds. Retime by editing these numbers only.
      const CUE = {
        c03a: 0.30, //   VO 03a narrator: "Meanwhile, at the council..."
        mails: 2.02, //  beat: "every report lands in the same inbox", emails start dropping
        n340: 4.65, //   beat: counter reaches 340 ("Missing details. Wrong department.")
        n1204: 6.68, //  beat: counter reaches 1,204 ("Hundreds of them, every day.")
        c03b: 8.69, //   VO 03b worker: "No location. No depth. And this one's on the M1..."
        tag1: 8.84, //   beat: "No location"
        tag2: 9.74, //  beat: "No depth"
        tag3: 10.93, //  beat: "this one's on the M1"
        slump: 11.68, // beat: "That's not even ours." worker slumps
      };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#ci-title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, CUE.c03a - 0.3);
      tl.fromTo("#ci-subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, CUE.mails - 0.4);
      tl.fromTo("#ci-worker", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, CUE.c03a - 0.1);
      tl.fromTo("#ci-inbox", { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, CUE.c03a + 0.1);

      // Emails drop in, accelerating, finishing as the counter tops out
      const mails = gsap.utils.toArray(".ci-mail:not(.ci-tagged)");
      const span = CUE.n1204 - CUE.mails;
      mails.forEach((m, i) => {
        const at = CUE.mails + span * Math.pow(i / mails.length, 0.7);
        tl.fromTo(m, { y: -300, opacity: 0, rotation: 0 }, { y: 0, opacity: 1, rotation: (i % 3) - 1, duration: 0.35, ease: "power2.out" }, at);
      });

      // Counter: holds 12, climbs to 340, then 1,204 (piecewise on one proxy so seeking is exact)
      const clock = { t: 0 };
      const ease = gsap.parseEase("power2.inOut");
      const count = (t) => {
        if (t < CUE.mails) return 12;
        if (t < CUE.n340) return 12 + (340 - 12) * ease((t - CUE.mails) / (CUE.n340 - CUE.mails));
        if (t < CUE.n1204) return 340 + (1204 - 340) * ease((t - CUE.n340) / (CUE.n1204 - CUE.n340));
        return 1204;
      };
      tl.fromTo(
        clock,
        { t: 0 },
        {
          t: CUE.n1204 + 0.1,
          duration: CUE.n1204 + 0.1,
          ease: "none",
          onUpdate: () => {
            document.querySelector("#ci-count").textContent = Math.round(count(clock.t)).toLocaleString("en-GB");
          },
        },
        0,
      );
      tl.fromTo("#ci-count", { scale: 1 }, { scale: 1.2, duration: 0.15, yoyo: true, repeat: 1 }, CUE.n340 - 0.15);
      tl.fromTo("#ci-count", { scale: 1 }, { scale: 1.3, duration: 0.15, yoyo: true, repeat: 1, immediateRender: false }, CUE.n1204 - 0.15);
      tl.fromTo("#ci-sweat", { opacity: 0, y: 0 }, { opacity: 1, y: 60, duration: 1.2, ease: "power1.in" }, CUE.n1204 - 1.0);

      // 03b: three tagged cards slap on top as the worker names them
      [["#ci-t1", CUE.tag1], ["#ci-t2", CUE.tag2], ["#ci-t3", CUE.tag3]].forEach(([sel, at], i) => {
        tl.fromTo(sel, { opacity: 0, scale: 1.25, rotation: 0 }, { opacity: 1, scale: 1, rotation: i === 1 ? 1 : -1, duration: 0.3, ease: "power4.out" }, at);
        tl.fromTo(sel + " .ci-tag", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, at + 0.25);
      });

      // Worker slumps: heavy lids, frown, sinks behind the desk
      tl.fromTo(["#ci-lid-l", "#ci-lid-r"], { opacity: 0 }, { opacity: 1, duration: 0.2 }, CUE.c03b);
      tl.fromTo("#ci-mouth", { opacity: 1 }, { opacity: 0, duration: 0.2 }, CUE.slump);
      tl.fromTo("#ci-mouth-sad", { opacity: 0 }, { opacity: 1, duration: 0.2 }, CUE.slump);
      tl.fromTo("#ci-worker", { y: 0, rotation: 0 }, { y: 120, rotation: -6, duration: 1.2, ease: "power2.inOut" }, CUE.slump);
      window.__timelines["council-inbox"] = tl;
    })();
  </script>
