<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Hack for Impact logo</title>
  <desc id="desc">A smiling tree whose roots become glowing circuit traces in the soil.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9F8F0"/>
      <stop offset="1" stop-color="#C7EBD9"/>
    </linearGradient>
    <radialGradient id="leaf" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#8EE07A"/>
      <stop offset="0.55" stop-color="#4CB85A"/>
      <stop offset="1" stop-color="#2E8B47"/>
    </radialGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A4A22"/>
      <stop offset="0.5" stop-color="#9C6334"/>
      <stop offset="1" stop-color="#6E411D"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A3A20"/>
      <stop offset="1" stop-color="#3E2714"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Badge -->
  <circle cx="256" cy="256" r="246" fill="#1E6B3A"/>
  <circle cx="256" cy="256" r="236" fill="url(#sky)"/>

  <!-- Sun peeking behind the canopy -->
  <circle cx="392" cy="118" r="26" fill="#FFD45C"/>

  <!-- Soil: segment of the badge circle below y=392 -->
  <path d="M63 392 Q256 372 449 392 A236 236 0 0 1 63 392 Z" fill="url(#soil)"/>
  <path d="M63 392 Q256 372 449 392" fill="none" stroke="#3F9E4E" stroke-width="10" stroke-linecap="round"/>

  <!-- Circuit roots -->
  <g fill="none" stroke="#F5C443" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M232 392 L208 408 H124"/>
    <path d="M240 392 V416 L210 440 H154"/>
    <path d="M248 392 V456"/>
    <path d="M264 392 V424 L292 448 H346"/>
    <path d="M272 392 V408 L300 420 H388"/>
  </g>
  <g fill="#FFE79A" stroke="#F5C443" stroke-width="4" filter="url(#glow)">
    <circle cx="116" cy="408" r="9"/>
    <circle cx="146" cy="440" r="9"/>
    <circle cx="248" cy="464" r="8"/>
    <circle cx="354" cy="448" r="9"/>
    <circle cx="396" cy="420" r="9"/>
  </g>

  <!-- Trunk -->
  <path d="M228 270 C236 320 230 362 206 398 L306 398 C282 362 276 320 284 270 Z"
        fill="url(#bark)" stroke="#4A2C12" stroke-width="8" stroke-linejoin="round"/>
  <path d="M250 330 Q256 350 252 380" fill="none" stroke="#5C3816" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- Canopy: outline pass then fill pass so overlapping blobs merge cleanly -->
  <g fill="#1E6B3A" stroke="#1E6B3A" stroke-width="16">
    <circle cx="256" cy="200" r="112"/>
    <circle cx="160" cy="226" r="70"/>
    <circle cx="352" cy="226" r="70"/>
    <circle cx="186" cy="132" r="66"/>
    <circle cx="326" cy="132" r="66"/>
    <circle cx="256" cy="98" r="70"/>
  </g>
  <g fill="url(#leaf)">
    <circle cx="256" cy="200" r="112"/>
    <circle cx="160" cy="226" r="70"/>
    <circle cx="352" cy="226" r="70"/>
    <circle cx="186" cy="132" r="66"/>
    <circle cx="326" cy="132" r="66"/>
    <circle cx="256" cy="98" r="70"/>
  </g>

  <!-- Canopy highlights -->
  <g fill="#B8F29E" opacity="0.55">
    <path d="M176 112 Q186 80 222 78 Q212 108 176 112 Z"/>
    <path d="M118 214 Q120 190 140 182 Q140 204 118 214 Z"/>
    <circle cx="240" cy="62" r="8"/>
  </g>

  <!-- Fruit / nodes in the canopy -->
  <g stroke="#1E6B3A" stroke-width="4">
    <circle cx="150" cy="168" r="11" fill="#FF7A59"/>
    <circle cx="364" cy="172" r="11" fill="#FF7A59"/>
    <circle cx="312" cy="82" r="9" fill="#FFD45C"/>
    <circle cx="380" cy="252" r="9" fill="#FFD45C"/>
  </g>

  <!-- Face -->
  <g>
    <ellipse cx="220" cy="180" rx="13" ry="17" fill="#163A24"/>
    <ellipse cx="292" cy="180" rx="13" ry="17" fill="#163A24"/>
    <circle cx="225" cy="173" r="5" fill="#FFFFFF"/>
    <circle cx="297" cy="173" r="5" fill="#FFFFFF"/>
    <ellipse cx="190" cy="214" rx="17" ry="10" fill="#FF8FA3" opacity="0.7"/>
    <ellipse cx="322" cy="214" rx="17" ry="10" fill="#FF8FA3" opacity="0.7"/>
    <path d="M218 214 Q256 268 294 214 Z" fill="#163A24" stroke="#163A24" stroke-width="6" stroke-linejoin="round"/>
    <path d="M232 230 Q256 218 280 230 Q270 241 256 242 Q242 241 232 230 Z" fill="#FF6F8B"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <path d="M120 120 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z"/>
    <path d="M430 300 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z"/>
  </g>
</svg>
