name: Deploy to DGX Spark

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: ./deploy.sh
        env:
          # Optional repository variables; empty means use the defaults in src/app/config.py.
          OLLAMA_URL: ${{ vars.OLLAMA_URL }}
          OLLAMA_MODEL: ${{ vars.APP_MODEL }}
