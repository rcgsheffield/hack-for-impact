name: Smoke test (Spark GPU + Ollama)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/smoke/**"
      - ".github/workflows/smoke.yml"
concurrency:
  group: smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: self-hosted
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/smoke
    steps:
      - uses: actions/checkout@v4
      - name: Host GPU
        run: nvidia-smi
      - name: Start stack
        run: docker compose up -d --build
      - name: Smoke test
        run: ./smoke_test.sh
      - name: Logs
        if: always()
        run: docker compose logs --tail=100
      - name: Stop stack
        if: always()
        run: docker compose down
