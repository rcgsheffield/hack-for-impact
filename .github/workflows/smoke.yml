name: Smoke test (Spark GPU + Ollama)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/smoke/**"
      - ".github/workflows/smoke.yml"
concurrency:
  group: smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/smoke
    steps:
      - uses: actions/checkout@v4
      - name: Host GPU
        run: nvidia-smi
      # Uses the organisers' shared Ollama (spark-hack-ollama); no Docker needed.
      # Override via repo variables OLLAMA_URL / OLLAMA_MODEL.
      - name: Smoke test
        env:
          OLLAMA_URL: ${{ vars.OLLAMA_URL || 'http://127.0.0.1:11434' }}
          MODEL: ${{ vars.OLLAMA_MODEL || 'nemotron-3-nano:30b' }}
        run: ./smoke_test.sh
